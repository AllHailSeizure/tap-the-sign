name: Release Devvit app
run-name: Release ${{ github.ref_name }}

# Pushing a vX.Y.Z tag publishes that exact commit to the Devvit App Store.
# The logic lives in AllHailSeizure/.github (devvit-release.yml). There is
# deliberately no manual trigger.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    # The reusable workflow's github-release job needs contents: write; its
    # release gates read CI results (actions, checks, statuses: read); its
    # publish job is read-only.
    permissions:
      contents: write
      actions: read
      checks: read
      statuses: read
    uses: AllHailSeizure/.github/.github/workflows/devvit-release.yml@master
    with:
      visibility: unlisted # change to `public` to publish publicly
    secrets:
      DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_AUTH_TOKEN }}
