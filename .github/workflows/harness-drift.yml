name: Test harness drift

# Fails (without changing anything) when src/server/test-harness/ differs from
# devvit-app-template master. Fix with `npm run harness:sync` and a PR.
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    if: github.repository != 'AllHailSeizure/devvit-app-template'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node scripts/sync-test-harness.mjs --check
